# Memecoin smart-money divergence bot — settings
# Edit these, then restart the bot. API keys go in .env, not here.

[mode]
# "paper" = simulated trades only. "live" = real swaps through GMGN.
# Live also requires LIVE_TRADING_CONFIRM=yes in .env as a second lock.
trading_mode = "paper"
paper_starting_balance_usd = 1000.0

[timing]
scan_interval_min = 15          # always-on mode only: how often to look for new entries
manage_interval_min = 2         # always-on mode only: how often to check prices (free)

[nansen]
# Hard cap on Nansen API calls per run. With 2, each run spends:
#   1 call checking smart money on ALL open positions at once (skipped if none open)
#   1 call scanning for new coins
max_calls_per_run = 2
# Only call Nansen this often. Runs in between just check prices (free) for the
# trailing and hard stops. Each call costs ~5 credits: every 4h with a position
# open ≈ 12 calls/day ≈ 60 credits/day.
nansen_every_hours = 4

[universe]
max_token_age_days = 30
# Nansen scan floor. A $10M ATH that is now 76% down is $2.4M, so scan from $2.4M.
min_market_cap_usd = 2400000
max_market_cap_usd = 1000000000
min_liquidity_usd = 75000
# Nansen smart money labels to count. Options: Fund, Smart Trader,
# 30D Smart Trader, 90D Smart Trader, 180D Smart Trader
smart_money_labels = ["Fund", "Smart Trader", "30D Smart Trader", "90D Smart Trader"]

[entry]
# --- ATH pullback zone (all from 1-minute candle BODY closes, never wicks) ---
min_ath_mcap_usd = 10000000     # coin must have reached at least a $10M market cap
min_drawdown_pct = 61.8         # latest 1m close at least 61.8% below ATH close...
max_drawdown_pct = 76.0         # ...and no more than 76% below
# Support: no 1m close below the 76% line since the ATH, and price has held
# inside the zone for at least this long before we buy.
min_hours_in_zone = 1.0

# --- Smart money accumulation (the divergence) ---
accumulation_window = "7d"      # 24h, 7d or 30d: window for the supply % below
min_sm_supply_pct = 0.5         # smart money net bought >= 0.5% of supply in the window
require_sm_buying_24h = true    # and is still net buying over the last 24h
require_price_dropping = true   # while price fell over the same window
min_sm_trader_count = 3         # distinct smart wallets

min_liquidity_to_mcap = 0.02    # pool must be at least 2% of market cap
# Coins that pass every rule are ranked by a 0-100 score (supply bought, wallets,
# persistence across scans, buying now, time holding the zone, ...). 0 = rules
# alone decide; raise it later if the signal lab shows high scores do better.
min_entry_score = 0
# Candle checks use the free GeckoTerminal API (~30 requests/min, ~4 per coin),
# so only the top N coins by smart money supply bought get checked per scan.
max_candle_checks = 15

# Optional extra check per coin with Nansen flow intelligence. Off by default:
# each check is one more call, and it only runs if max_calls_per_run leaves room.
confirm_with_flow_intelligence = false
confirm_timeframe = "1d"        # 5m, 1h, 6h, 12h, 1d, 7d
min_confirm_netflow_usd = 5000
min_confirm_wallets = 3

[lab]
# Signal lab: follow every coin that passes the hard filters (bought or not)
# and record its return 4h / 24h / 72h later. Free (DexScreener prices).
track_per_scan = 15

[risk]
position_size_usd = 50.0
max_open_positions = 5
max_daily_loss_usd = 150.0       # stop opening new trades for the day after this
reentry_cooldown_hours = 24
assumed_slippage_pct = 3.0       # paper mode: haircut on each fill
assumed_fee_pct = 1.0            # paper mode: GMGN/priority fees

[exit]
trailing_stop_pct = 25.0         # sell when price falls this far from its peak since entry
trailing_activation_pct = 0.0    # trail only after this gain (0 = trail from entry)
# Support break: sell when a 1m candle CLOSES below the max-drawdown line (76% below ATH).
exit_on_support_break = true
hard_stop_loss_pct = 35.0        # backstop; in live mode also placed as a GMGN stop order
# Follow smart money out
exit_on_sm_outflow = true
sm_exit_window = "24h"           # 1h, 24h or 7d
sm_exit_netflow_usd = -5000      # sell if smart money net flow over the window is below this
max_hold_days = 14

[gmgn]
chain = "sol"                    # GMGN's chain name for Solana; check `gmgn-cli swap --help`
slippage_pct = 15
anti_mev = true
